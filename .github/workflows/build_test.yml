# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project:
          - name: TestProject1
            path: TestProject1/TestProject1.csproj
          - name: TestProject2
            path: TestProject2/TestProject2.csproj
          - name: TestProject3
            path: TestProject3/TestProject3.csproj

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
      
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore
    
    - name: Run ${{ matrix.project.name }} tests
      run: dotnet test ${{ matrix.project.path }} --no-build --verbosity normal
